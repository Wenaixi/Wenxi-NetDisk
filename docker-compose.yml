version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wenxi-backend
    ports:
      - "4499:8088"
    environment:
      - PORT=8088
      - DATABASE_URL=sqlite:///./data/wenxi_netdisk.db
      - WENXI_FILE_STORAGE_PATH=./data/uploads
      - WENXI_ENCRYPTION_KEY=${WENXI_ENCRYPTION_KEY:-wenxi-universal-encryption-key-v2-change-in-production}
      - WENXI_ENCRYPTION_SALT=${WENXI_ENCRYPTION_SALT:-wenxi-universal-salt-v2-change-in-production}
      - WENXI_JWT_SECRET_KEY=${WENXI_JWT_SECRET_KEY:-wenxi-super-secret-key-change-in-production}
      - WENXI_JWT_EXPIRE_MINUTES=30
      - WENXI_LOG_LEVEL=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/backend/data
      - ./uploads:/app/backend/uploads
    networks:
      - wenxi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wenxi-frontend
    ports:
      - "3399:3000"
    environment:
      - BACKEND_URL=http://backend:8088
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wenxi-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wenxi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - wenxi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  wenxi-network:
    driver: bridge

volumes:
  redis-data:
