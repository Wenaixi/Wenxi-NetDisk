name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-asyncio
        pip install -r requirements.txt
    
    - name: Lint backend with flake8
      working-directory: ./backend
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test backend with pytest
      working-directory: ./backend
      env:
        WENXI_ENCRYPTION_KEY: test-key-32-bytes-long-for-ci-test
        WENXI_ENCRYPTION_SALT: test-salt-16-by
        WENXI_JWT_SECRET_KEY: test-jwt-secret-key-for-ci-testing
        WENXI_JWT_EXPIRE_MINUTES: 60
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest ../tests/ -v --tb=short || true

  frontend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: |
        npm ci
    
    - name: Build frontend
      working-directory: ./frontend
      run: |
        npm run build
    
    - name: Run frontend tests
      working-directory: ./frontend
      run: |
        npm test -- --run || true

  security-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Run security tests
      working-directory: ./backend
      env:
        WENXI_ENCRYPTION_KEY: test-key-32-bytes-long-for-ci-test
        WENXI_ENCRYPTION_SALT: test-salt-16-by
        WENXI_JWT_SECRET_KEY: test-jwt-secret-key-for-ci-testing
        WENXI_JWT_EXPIRE_MINUTES: 60
      run: |
        pip install -r requirements.txt
        python ../tests/test_security_variables.py || true
